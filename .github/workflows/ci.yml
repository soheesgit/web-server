# CI: Linux·macOS에서 빌드, 린트, 테스트(unit + e2e), Linux는 ASan까지.
# PENDING은 실패가 아니다. FAIL과 UNEXPECTED PASS만 빨간불 (docs/TESTING.md).
name: ci

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # clang-format은 메이저 버전마다 출력이 달라 apt 버전(이미지마다 다름) 대신 18.1.8로 고정한다 (D-030).
      - name: Install clang-format 18.1.8 (Linux)
        if: runner.os == 'Linux'
        run: |
          python3 -m venv "$RUNNER_TEMP/cf"
          "$RUNNER_TEMP/cf/bin/pip" install --quiet clang-format==18.1.8
          echo "CLANG_FORMAT=$RUNNER_TEMP/cf/bin/clang-format" >> "$GITHUB_ENV"

      - name: Build
        run: make

      - name: Lint
        run: make lint

      - name: Test (unit + e2e)
        run: make test

      - name: Test (event loop e2e)
        run: make e2e ENGINE=loop

      - name: ASan + UBSan (Linux)
        if: runner.os == 'Linux'
        run: |
          make asan
          make asan ENGINE=loop

      # 기획서 ID 밖의 보조 스위트: 성질 검사 + 공격·경계 E2E (tests/robust/README.md)
      - name: Robustness suite (Linux)
        if: runner.os == 'Linux'
        run: make robust
