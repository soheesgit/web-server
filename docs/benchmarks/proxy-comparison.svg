<text x="428" y="159" font-size="13" font-weight="400">RR</text>
<rect x="560" y="144" width="117.6" height="17" rx="2" fill="#37689d"/>
<path d="M615.9 152.5H739.2 M615.9 148.5v8 M739.2 148.5v8" stroke="#183047" fill="none"/>
<text x="560" y="178" font-size="12" font-weight="400">13.29 ms</text>
