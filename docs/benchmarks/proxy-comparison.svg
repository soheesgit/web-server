<svg xmlns="http://www.w3.org/2000/svg" width="900" height="585" viewBox="0 0 900 585" role="img" aria-labelledby="title">
<title id="title">Proxy benchmark means and standard deviations</title>
<rect width="900" height="585" fill="#ffffff"/>
<g font-family="system-ui, sans-serif" fill="#183047">
<text x="35" y="38" font-size="22" font-weight="700">C HTTP proxy · 90 trials</text>
<text x="35" y="65" font-size="13" font-weight="400">Bar length is the mean. Whiskers show one sample standard deviation.</text>
<text x="35" y="114" font-size="17" font-weight="700">Heterogeneous backends</text>
