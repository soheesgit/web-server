# E2E 프록시 설정 (D-016): upstream 2개
#   app   = {BACKEND1} {BACKEND2} {BACKEND3}  (/api/ → strip 후 전달, 라운드로빈)
#   admin = {BACKEND4}                        (Host: admin.local 전용)
# 치환: {PORT} {ROOT} {BACKEND1}~{BACKEND4} — tests/e2e/test_proxy.py

listen 127.0.0.1:{PORT}
root {ROOT}

upstream app {BACKEND1} {BACKEND2} {BACKEND3}
upstream admin {BACKEND4}

route / static {ROOT}
route /api/ proxy app strip
host admin.local route / proxy admin
